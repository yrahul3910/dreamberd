[package]
name = "dreamberd"
version = "0.1.0"
edition = "2024"
description = "A DreamBerd (GulfOfMexico) interpreter — Rust port"

[lib]
name = "dreamberd"
path = "src/lib.rs"

[[bin]]
name = "dreamberd"
path = "src/main.rs"

[dependencies]
clap = { version = "^4.6.0", default-features = false, features = ["derive", "help", "usage", "suggestions", "error-context", "std"] }
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1.12.4"
thiserror = "2.0.18"

